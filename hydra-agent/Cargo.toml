[package]
name = "hydra-agent"
version = "0.1.0"
edition = "2021"
authors = ["Hydra Team"]
description = "Hydra Agent - Lightweight infrastructure profiler"
license = "Apache-2.0"
repository = "https://github.com/iiTzGedo/hydra"
rust-version = "1.75"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
toml_edit = "0.22"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
blake3 = "1.5"
clap = { version = "4.4", features = ["derive", "env"] }
config = "0.14"
directories = "5.0"
rpassword = "7.3"
regex = "1.10"
sha2 = "0.10"
rand = "0.8"

# System info collectors
sysinfo = "0.30"
hostname = "0.3"
local-ip-address = "0.6"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["user", "net", "fs"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
procfs = "0.16"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_System_SystemInformation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Registry",
]}
winreg = "0.52"

[target.'cfg(target_os = "freebsd")'.dependencies]
# FreeBSD uses pkg - no additional deps needed

[target.'cfg(target_os = "openbsd")'.dependencies]
# OpenBSD uses pkg_info - no additional deps needed

[target.'cfg(target_os = "netbsd")'.dependencies]
# NetBSD uses pkg_info - no additional deps needed

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
wiremock = "0.5"
tempfile = "3.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "hydra-agent"
path = "src/main.rs"
