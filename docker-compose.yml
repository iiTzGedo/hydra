# Hydra Docker Compose
#
# Quick start:
#   cp .env.docker.example .env.docker   # fill in your values
#   docker compose up -d
#
# With bundled databases:
#   docker compose --profile local-db up -d

services:
  hydra-api:
    build:
      context: ./hydra-api
      dockerfile: Dockerfile
    network_mode: host
    env_file: .env.docker
    environment:
      - HYDRA_ENV=${HYDRA_ENV:-development}
      - HYDRA_DEBUG=${HYDRA_DEBUG:-false}
      - HYDRA_MONGODB_DATABASE=hydra
      - HYDRA_JWT_ALGORITHM=HS256
      - HYDRA_JWT_EXPIRE_MINUTES=60
      - HYDRA_ENCRYPTION_KEY=${HYDRA_ENCRYPTION_KEY:-MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=}
      - HYDRA_MCP_INTERNAL_SECRET=${HYDRA_MCP_INTERNAL_SECRET:-hydra-dev-internal-secret-0123456789abcdef}
      - HYDRA_CORS_ORIGINS=["*"]
      - HYDRA_SMTP_ENABLED=${HYDRA_SMTP_ENABLED:-false}
      - HYDRA_SMTP_HOST=${HYDRA_SMTP_HOST:-}
      - HYDRA_SMTP_PORT=${HYDRA_SMTP_PORT:-587}
    volumes:
      - ./hydra-api/hydra:/app/hydra:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  hydra-mcp:
    build:
      context: ./hydra-mcp
      dockerfile: Dockerfile
    network_mode: host
    environment:
      - HYDRA_MCP_TRANSPORT=http
      - HYDRA_MCP_HTTP_HOST=0.0.0.0
      - HYDRA_MCP_HTTP_PORT=8081
      - HYDRA_MCP_CORS_ORIGINS=["*"]
      - HYDRA_MCP_API_URL=http://localhost:8080/api/v1
      - HYDRA_MCP_API_TIMEOUT=60
      - HYDRA_MCP_INTERNAL_SECRET=${HYDRA_MCP_INTERNAL_SECRET:-hydra-dev-internal-secret-0123456789abcdef}
      - HYDRA_MCP_TOON_INDENT=2
      - HYDRA_MCP_TOON_DELIMITER=,
      - HYDRA_MCP_LOG_LEVEL=INFO
      - HYDRA_MCP_LOG_FORMAT=json
    volumes:
      - ./hydra-mcp/hydra:/app/hydra:ro
    depends_on:
      hydra-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  hydra-web:
    build:
      context: ./hydra-web
      dockerfile: Dockerfile
    command: ["npm", "run", "dev"]
    network_mode: host
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - HYDRA_API_URL=${HYDRA_API_URL:-}
      - HYDRA_API_PROXY_TARGET=${HYDRA_API_PROXY_TARGET:-http://localhost:8080}
    volumes:
      - ./hydra-web/src:/app/src:ro
      - ./hydra-web/app:/app/app:ro
      - ./hydra-web/public:/app/public:ro
      - ./hydra-web/middleware.ts:/app/middleware.ts:ro
    depends_on:
      - hydra-api

  # Bundled data services (optional)
  # Use: docker compose --profile local-db up -d
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    profiles:
      - local-db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    profiles:
      - local-db

  garage:
    image: dxflrs/garage:v1.0.0
    ports:
      - "3900:3900"
      - "3903:3903"
    volumes:
      - garage_data:/var/lib/garage
      - ./garage.toml:/etc/garage.toml:ro
    command: ["/garage", "server", "-c", "/etc/garage.toml"]
    profiles:
      - local-db

volumes:
  mongodb_data:
  redis_data:
  garage_data:
