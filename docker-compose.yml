# Hydra Production Docker Compose
#
# This compose file supports two modes:
#
# 1. BUNDLED MODE (default): Runs MongoDB, Redis, and Garage locally
#    docker compose --profile bundled up -d
#
# 2. EXTERNAL MODE: Connects to external data services
#    docker compose up -d
#    (Configure external URLs via environment variables)
#
# See scripts/setup-data-layer.sh for automated setup

version: '3.8'

services:
  # ============================================
  # HYDRA SERVICES
  # ============================================

  hydra-api:
    build:
      context: ./hydra-api
      dockerfile: Dockerfile
    container_name: hydra-api
    ports:
      - "${HYDRA_API_PORT:-8080}:8080"
    environment:
      - HYDRA_ENV=${HYDRA_ENV:-production}
      - HYDRA_MONGODB_URI=${HYDRA_MONGODB_URI:-mongodb://mongodb:27017}
      - HYDRA_MONGODB_DATABASE=${HYDRA_MONGODB_DATABASE:-hydra}
      - HYDRA_REDIS_URL=${HYDRA_REDIS_URL:-redis://redis:6379/0}
      - HYDRA_JWT_SECRET=${HYDRA_JWT_SECRET}
      - HYDRA_OBJECT_STORAGE_ENABLED=${HYDRA_OBJECT_STORAGE_ENABLED:-true}
      - HYDRA_OBJECT_STORAGE_ENDPOINT=${HYDRA_OBJECT_STORAGE_ENDPOINT:-http://garage:3900}
      - HYDRA_OBJECT_STORAGE_BUCKET=${HYDRA_OBJECT_STORAGE_BUCKET:-hydra-bucket}
      - HYDRA_OBJECT_STORAGE_ACCESS_KEY=${HYDRA_OBJECT_STORAGE_ACCESS_KEY}
      - HYDRA_OBJECT_STORAGE_SECRET_KEY=${HYDRA_OBJECT_STORAGE_SECRET_KEY}
      - HYDRA_OBJECT_STORAGE_REGION=${HYDRA_OBJECT_STORAGE_REGION:-garage}
      - HYDRA_SMTP_ENABLED=${HYDRA_SMTP_ENABLED:-false}
      - HYDRA_SMTP_HOST=${HYDRA_SMTP_HOST}
      - HYDRA_SMTP_PORT=${HYDRA_SMTP_PORT:-587}
      - HYDRA_SMTP_USERNAME=${HYDRA_SMTP_USERNAME}
      - HYDRA_SMTP_PASSWORD=${HYDRA_SMTP_PASSWORD}
      - HYDRA_SMTP_FROM_ADDRESS=${HYDRA_SMTP_FROM_ADDRESS}
      - HYDRA_SMTP_FROM_NAME=${HYDRA_SMTP_FROM_NAME:-Hydra}
      - HYDRA_CORS_ORIGINS=${HYDRA_CORS_ORIGINS:-["http://localhost:5173","http://localhost:3000"]}
    depends_on:
      mongodb:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
      garage:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - hydra-network

  hydra-mcp:
    build:
      context: ./hydra-mcp
      dockerfile: Dockerfile
    container_name: hydra-mcp
    ports:
      - "${HYDRA_MCP_PORT:-8081}:8081"
    environment:
      - HYDRA_API_URL=http://hydra-api:8080/api/v1
    depends_on:
      - hydra-api
    restart: unless-stopped
    networks:
      - hydra-network

  hydra-web:
    build:
      context: ./hydra-web
      dockerfile: Dockerfile
    container_name: hydra-web
    ports:
      - "${HYDRA_WEB_PORT:-3000}:80"
    environment:
      - VITE_API_URL=${HYDRA_API_URL:-http://localhost:8080/api/v1}
    depends_on:
      - hydra-api
    restart: unless-stopped
    networks:
      - hydra-network

  # ============================================
  # BUNDLED DATA SERVICES (profile: bundled)
  # ============================================

  mongodb:
    image: mongo:7.0
    container_name: hydra-mongodb
    profiles: ["bundled"]
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-hydra}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASS:-changeme}
      - MONGO_INITDB_DATABASE=hydra
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/hydra --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - hydra-network

  redis:
    image: redis:7-alpine
    container_name: hydra-redis
    profiles: ["bundled"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hydra-network

  garage:
    image: dxflrs/garage:v1.0.0
    container_name: hydra-garage
    profiles: ["bundled"]
    ports:
      - "${GARAGE_S3_PORT:-3900}:3900"      # S3 API
      - "${GARAGE_ADMIN_PORT:-3903}:3903"   # Admin API
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET:-changeme}
    volumes:
      - garage_data:/var/lib/garage
      - garage_meta:/var/lib/garage/meta
      - ./garage.toml:/etc/garage.toml:ro
    command: ["/garage", "server", "-c", "/etc/garage.toml"]
    restart: unless-stopped
    networks:
      - hydra-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
  garage_data:
    driver: local
  garage_meta:
    driver: local

networks:
  hydra-network:
    driver: bridge
