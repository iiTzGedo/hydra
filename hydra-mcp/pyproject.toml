[project]
name = "hydra-mcp"
version = "0.1.0"
description = "Hydra MCP Service - AI interface layer for infrastructure queries"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "iiTzGedo" }]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.26.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "structlog>=24.1.0",
    "toon-format @ git+https://github.com/toon-format/toon-python.git@6b26984a01279defdcf40ab9d09bc418fe8133ac",
    "uvicorn[standard]>=0.27.0",
    "fastapi>=0.109.0",
    "starlette>=0.36.0",
    "anyio>=4.0.0",
    "jsonschema>=4.20.0",
]

[project.scripts]
hydra-mcp = "hydra_mcp.server:run"

[project.optional-dependencies]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["hydra_mcp"]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]
ignore = ["E501", "B008", "B904"]

[tool.ruff.isort]
known-first-party = ["hydra_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=hydra_mcp --cov-report=term-missing --cov-fail-under=50"

[tool.mypy]
python_version = "3.12"
strict = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pip-audit>=2.10.0",
]
