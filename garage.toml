# Garage Configuration for Hydra
# S3-compatible object storage for agent binary distribution
#
# See: https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"

db_engine = "sqlite"

replication_factor = 1

[s3_api]
api_bind_addr = "[::]:3900"
s3_region = "garage"
root_domain = ".s3.garage.localhost"

[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.garage.localhost"
index = "index.html"

[admin]
api_bind_addr = "[::]:3903"
admin_token_file = "/var/lib/garage/admin_token"

[rpc]
bind_addr = "[::]:3901"
# RPC secret should be set via environment variable GARAGE_RPC_SECRET
# Or uncomment and set here for development:
# secret = "your-secret-here"
