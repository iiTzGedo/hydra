name: Security Audit

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch: # Allow manual triggers

jobs:
  api-audit:
    name: API Dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hydra-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: hydra-api/uv.lock
      - name: Export locked dependencies
        run: uv export --frozen --no-dev --no-editable --no-emit-project --no-hashes --output-file requirements-audit.txt
      - name: Audit hydra-api
        run: uv tool run --from pip-audit pip-audit --desc -r requirements-audit.txt

  mcp-audit:
    name: MCP Dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hydra-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: hydra-mcp/uv.lock
      - name: Export locked dependencies
        run: uv export --frozen --no-dev --no-editable --no-emit-project --no-hashes --output-file requirements-audit.txt
      - name: Audit hydra-mcp
        run: uv tool run --from pip-audit pip-audit --desc -r requirements-audit.txt

  npm-audit:
    name: NPM Dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hydra-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hydra-web/package-lock.json
      - run: npm ci
      - name: Audit
        run: npm audit --omit=dev

  cargo-audit:
    name: Rust Dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hydra-agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit
      - name: Audit
        run: cargo audit

  container-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: hydra-web
            dockerfile: hydra-web/Dockerfile
            image: hydra-web:scan
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ${{ matrix.image }} -f ${{ matrix.dockerfile }} ${{ matrix.context }}
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
