name: Security Audit

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch: # Allow manual triggers

jobs:
  python-audit:
    name: Python Dependencies
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [hydra-api, hydra-mcp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - name: Audit ${{ matrix.component }}
        run: pip-audit -r <(pip install -e ".[${{ matrix.component == 'hydra-api' && 'dev' || '' }}]" --dry-run --report - 2>/dev/null || pip-audit --desc -f json ${{ matrix.component }})
        working-directory: ${{ matrix.component }}
        continue-on-error: true
      - name: Install and audit
        run: |
          cd ${{ matrix.component }}
          pip install -e "." 2>/dev/null || true
          pip-audit --desc
        continue-on-error: true

  npm-audit:
    name: NPM Dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hydra-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hydra-web/package-lock.json
      - run: npm ci
      - name: Audit
        run: npm audit --omit=dev
        continue-on-error: true

  cargo-audit:
    name: Rust Dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hydra-agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit
      - name: Audit
        run: cargo audit
        continue-on-error: true
