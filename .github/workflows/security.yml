name: Security Audit

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch: # Allow manual triggers

jobs:
  python-audit:
    name: Python Dependencies
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [hydra-api, hydra-mcp]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - name: Install dependencies
        run: |
          cd ${{ matrix.component }}
          pip install -e "." 2>/dev/null || true
      - name: Audit ${{ matrix.component }}
        run: |
          cd ${{ matrix.component }}
          pip-audit --desc

  npm-audit:
    name: NPM Dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hydra-web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hydra-web/package-lock.json
      - run: npm ci
      - name: Audit
        run: npm audit --omit=dev

  cargo-audit:
    name: Rust Dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hydra-agent
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit
      - name: Audit
        run: cargo audit

  container-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: hydra-web
            dockerfile: hydra-web/Dockerfile.dev
            image: hydra-web:scan
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t ${{ matrix.image }} -f ${{ matrix.dockerfile }} ${{ matrix.context }}
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
