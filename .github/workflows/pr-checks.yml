name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hydra-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: hydra-api/uv.lock
      - run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Type Check
        run: uv run mypy hydra/
      - name: Test
        run: uv run pytest tests/ -v --tb=short

  web:
    name: Web (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hydra-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hydra-web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npx eslint . --ext ts,tsx --report-unused-disable-directives --max-warnings 0
      - name: Type Check
        run: npx tsc --noEmit
      - name: Test
        run: npx vitest run

  mcp:
    name: MCP (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hydra-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Type Check
        run: python -m mypy hydra_mcp/
      - name: Test
        run: python -m pytest tests/ -v --tb=short

  agent:
    name: Agent (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hydra-agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hydra-agent
      - name: Lint
        run: cargo clippy -- -D warnings
      - name: Test
        run: cargo test
